[platformio]
default_envs = waveshare_esp32s3_matrix
  
[env:waveshare_esp32s3_matrix]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.partitions = tools/partitions-4MB_spiffs-tinyuf2.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags =
  ${common.build_flags}
  ${esp32s3.build_flags}
  -D WLED_RELEASE_NAME=\"WS-S3-Matrix\"
  -D LEDPIN=14
  -D BTNPIN=-1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D HW_PIN_SDA=11
  -D HW_PIN_SCL=12
lib_deps =
  ${esp32s3.lib_deps}
  lewisxhe/SensorLib @ ^0.2.2
custom_usermods =
  qmi8658_imu
  Internal_Temperature_v2
