; ============================================================
; PlatformIO Configuration – Waveshare ESP32-S3-Matrix (WLED)
; https://www.waveshare.com/esp32-s3-matrix.htm
;
; Chip:    ESP32-S3FH4R2 (Xtensa® LX7 Dual-Core, 240 MHz)
; Flash:   4 MB (QIO-Modus)
; PSRAM:   2 MB (QPI)
; Wi-Fi:   2.4 GHz 802.11 b/g/n
; BT:      Bluetooth 5 LE
;
; Onboard-Peripherie:
;   GPIO14  → WS2812B Datenleitung (8×8 RGB-LED-Matrix, 64 LEDs)
;   GPIO10  → QMI8658 IMU INT1 
;   GPIO13  → QMI8658 IMU INT2 
;   GPIO11  → I2C SDA  (QMI8658 Sensor)
;   GPIO12  → I2C SCL  (QMI8658 Sensor)
;   QMI8658 I2C-Adresse: 0x6B
; ============================================================

[platformio]
default_envs = waveshare_esp32s3_matrix

[env:waveshare_esp32s3_matrix]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ---------- MCU / Takt ----------
board_build.mcu    = esp32s3
board_build.f_cpu  = 240000000L

; ---------- PSRAM (2 MB, QPI) ----------
board_build.arduino.memory_type = qio_qspi

; ---------- Flash 4MB QD, PSRAM: 2MB QD ----------
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = tools/WLED_ESP32_4MB_700k_FS.csv

; ---------- Upload / Monitor ----------
upload_speed    = 921600          ; Fallback für seriellen Upload
monitor_speed   = 115200

; ---------- Build-Flags ----------
build_flags =
  -D WLED_RELEASE_NAME=\"WS-S3-Matrix\"

  ; LED-Matrix (8×8 WS2812B)
  -D DATA_PINS=14
  -D DEFAULT_LED_PIN=14
  -D DEFAULT_LED_COUNT=64
  -D DEFAULT_LED_TYPE=22        ; TYPE_WS2812_RGB
  -D COL_ORDER_GRB=1          ; RGB statt GRB (WS2812B)
  -D BOARD_HAS_PSRAM
  -D I2CSCLPIN=12
  -D I2CSDAPIN=11

;------- Debug ---------
;  -D WLED_DEBUG

; ---------- serial programmer, no need for boot button beware! flash via boot button resets wifi creds! use OTA
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; ---------- Bibliotheken ----------
lib_deps =
  ${esp32s3.lib_deps}
  lewisxhe/SensorLib @ ^0.2.2    ; QMI8658 IMU-Treiber
  adafruit/Adafruit NeoPixel      ; optional – für standalone-Tests der Matrix

; ---------- Usermods ----------
custom_usermods =
 ; QMI8658_3Mode
 ; qmi8658_accel_ball
  QMI8658_Rotation
